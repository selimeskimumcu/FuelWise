<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="blueGlow" cx="20%" cy="18%" r="70%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="82%" cy="28%" r="65%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="52%" cy="92%" r="72%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38BDF8" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#0F172A"/>
  <rect width="1080" height="1080" fill="url(#blueGlow)"/>
  <rect width="1080" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1080" height="1080" fill="url(#purpleGlow)"/>

  <circle cx="540" cy="540" r="330" fill="none" stroke="#7DD3FC" stroke-opacity="0.045" stroke-width="2"/>
  <circle cx="540" cy="540" r="410" fill="none" stroke="#3B82F6" stroke-opacity="0.035" stroke-width="2"/>

  <text x="540" y="565" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="150" font-weight="900"
        letter-spacing="-8" filter="url(#logoGlow)">
    <tspan fill="#F8FAFC">Fuel</tspan><tspan fill="#38BDF8">Wise</tspan>
  </text>
</svg>
